<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | Ruby Wellington</title>

  <style>
    body {
      font-family: sans-serif;
      font-size: 14pt;
      line-height: 1.5;
      max-width: 960px;
      margin: 0 auto;
      color: #272727;
      padding: 1rem;
    }

    a {
      color: #ca1d00;
      text-decoration: none;
    }

    /* simple dark mode preference */
    @media (prefers-color-scheme: dark) {
      body {
        background-color: #141414;
        color: rgb(197, 209, 222);
      }

      a {
        color: #E14037;
      }
    }

    h2,
    h3 {
      margin-bottom: 0;
    }

    .time {
      font-size: 0.8em;
      color: #777;
    }

    .date {
      color: #777;
    }

    footer {
      background: #7773;
      opacity: 0.8;
      padding: 1em;
      font-size: smaller;
    }

    .event-summary {
      padding: 1rem;
      background: #7773;
      margin-bottom: 1rem;
    }

    .talk-list {
      margin: 0.5rem 0;
      padding-left: 1.2rem;
    }

    .talk-list li {
      margin-bottom: 0.25rem;
    }

    .event-meta {
      margin-top: 0.5rem;
      font-size: 0.8em;
      color: #777;
    }

    .event-meta .organisers,
    .event-meta .supporters {
      display: block;
    }

    .year-list {
      list-style: none;
      padding: 0;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .year-list li a {
      display: inline-block;
      padding: 0.3rem 0.8rem;
      background: #7773;
    }

    .year-list .count {
      font-size: 0.8em;
      opacity: 0.6;
    }

    .year-nav {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }

    .year-nav-btn {
      padding: 0.3rem 0.8rem;
      background: #7773;
    }

    .year-nav-btn.disabled {
      visibility: hidden;
    }

    .year-nav-btn:last-child {
      margin-left: auto;
    }

    .site-nav {
      display: flex;
      gap: 1rem;
      margin-top: 0.25rem;
    }

    .people-list {
      columns: 2;
      list-style: none;
      padding: 0;
    }

    .people-list li {
      margin-bottom: 0.25rem;
    }

    .person-talks li,
    .person-organised li {
      margin-bottom: 0.4rem;
    }
  </style>
</head>

<body>

  <header>
    <h1><a href="/">Ruby Wellington</a></h1>
    <nav class="site-nav">
      <a href="/meetups/">Meetups</a>
      <a href="/people/">People</a>
      <a href="/companies/">Companies</a>
    </nav>
  </header>

  <main>
    {{ content }}
  </main>
  </div>
</body>

</html>
